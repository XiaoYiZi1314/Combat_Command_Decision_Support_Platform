spring:
  application:
    name: ccds-bootstrap
  datasource:
    url: ${CCDS_MYSQL_URL:jdbc:mysql://127.0.0.1:3306/ccds?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${CCDS_MYSQL_USERNAME:ccds}
    password: ${CCDS_MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${CCDS_REDIS_HOST:127.0.0.1}
      port: ${CCDS_REDIS_PORT:6379}
      password: ${CCDS_REDIS_PASSWORD:}

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: ${CCDS_SERVER_PORT:8080}

ccds:
  jwt:
    access-secret: ${CCDS_JWT_ACCESS_SECRET:}
    refresh-secret: ${CCDS_JWT_REFRESH_SECRET:}
    access-ttl-seconds: ${CCDS_JWT_ACCESS_TTL_SECONDS:900}
    refresh-ttl-seconds: ${CCDS_JWT_REFRESH_TTL_SECONDS:1209600}
  cos:
    region: ${CCDS_COS_REGION:}
    bucket: ${CCDS_COS_BUCKET:}
    secret-id: ${CCDS_COS_SECRET_ID:}
    secret-key: ${CCDS_COS_SECRET_KEY:}
  map:
    baidu-ak: ${CCDS_BAIDU_MAP_AK:}
  model:
    api-key: ${CCDS_MODEL_API_KEY:}
  seed:
    password: ${CCDS_SEED_PASSWORD:}
